[mod-name]
godly_pipes=Godly Pipes

[mod-description]
godly_pipes=Custom sounds for placing or hand-crafting normal pipes, with adjustable chances and a shared 1/3-second cooldown per player.

[mod-setting-name]
pipe-sounds-chance-0=pipe0.wav chance (%)
pipe-sounds-chance-2=pipe2.wav chance (%)
pipe-sounds-chance-3=pipe3.wav chance (%)
pipe-sounds-chance-4=pipe4.wav chance (%)
pipe-sounds-chance-5=pipe5.wav chance (%)

[mod-setting-description]
pipe-sounds-chance-0=Chance per eligible pipe action after the 20-tick cooldown. A total below 100% leaves a chance of silence; totals above 100% are scaled proportionally. Set all chances to 0 to mute these sounds.
